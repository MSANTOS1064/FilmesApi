name: .NET Build and Test - FilmesApi
on:
  push:
    branches: [ develop, master, release/** ]
  pull_request:
    branches: [ develop, master, release/** ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x' # Troque se estiver usando outra versão

    - name: Restore dependencies
      run: dotnet restore FilmesApi.sln

    - name: Build solution
      run: dotnet build FilmesApi.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test FilmesApi.sln --no-build --verbosity normal
